# Fork RP2: added. The only existing workflow (build-executable.yml) is disabled (`if: false`) and targets
# Python 3.9, so nothing checked changes automatically. This runs on every push and pull request, on Windows,
# for each supported Python version. It needs neither the game nor the heavy requirements (torch, paddle).
name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless ruff==0.16.9

      # Catches syntax errors and invalid escape sequences such as "\F" (which will eventually become errors).
      - name: Compile every Python file
        run: python -W error::SyntaxWarning -m compileall -q -x venv .

      # Only the checks that indicate real bugs: syntax errors, undefined names, invalid comparisons.
      - name: Lint for real bugs
        run: ruff check --select E9,F63,F7,F82 .

      - name: Offline tests
        run: python -m unittest discover -s test/offline -v
